name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.12"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  COVERAGE_THRESHOLD: "40"
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKER_BUILDKIT: "1"

permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write
  pull-requests: write
  actions: read

jobs:
  pre-checks:
    name: Pre checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Secrets scan
        run: |
          TOOLS_DIR="$RUNNER_TEMP/ci-tools"
          GITLEAKS_DIR="$TOOLS_DIR/gitleaks/8.30.0"
          mkdir -p "$GITLEAKS_DIR"
          if [ ! -x "$GITLEAKS_DIR/gitleaks" ]; then
            curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz" \
              | tar -xz -C "$GITLEAKS_DIR" gitleaks
            chmod +x "$GITLEAKS_DIR/gitleaks"
          fi
          "$GITLEAKS_DIR/gitleaks" detect --source . --redact \
            --exit-code 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: golangci-lint
        run: |
          TOOLS_DIR="$RUNNER_TEMP/ci-tools"
          LINT_BIN_DIR="$TOOLS_DIR/golangci-lint/${{ env.GOLANGCI_LINT_VERSION }}/bin"
          mkdir -p "$LINT_BIN_DIR"
          if [ ! -x "$LINT_BIN_DIR/golangci-lint" ]; then
            curl -sSfL https://golangci-lint.run/install.sh \
              | sh -s -- -b "$LINT_BIN_DIR" ${{ env.GOLANGCI_LINT_VERSION }}
          fi
          "$LINT_BIN_DIR/golangci-lint" run --timeout=20m ./...

  sast:
    name: SAST
    runs-on: ubuntu-24.04
    needs: pre-checks
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Gosec
        run: |
          GO_BIN_DIR="$(go env GOPATH)/bin"
          export PATH="$GO_BIN_DIR:$PATH"
          if [ ! -x "$GO_BIN_DIR/gosec" ]; then
            go install github.com/securego/gosec/v2/cmd/gosec@latest
          fi
          "$GO_BIN_DIR/gosec" -exclude-generated -fmt text -severity high ./...

      - name: Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install semgrep
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --config p/golang --config p/owasp-top-ten \
            .

  sca:
    name: SCA
    runs-on: ubuntu-24.04
    needs: pre-checks
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: govulncheck
        run: |
          GO_BIN_DIR="$(go env GOPATH)/bin"
          export PATH="$GO_BIN_DIR:$PATH"
          if [ ! -x "$GO_BIN_DIR/govulncheck" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          fi
          "$GO_BIN_DIR/govulncheck" ./...

  build-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Unit tests + coverage + race detector
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./pkg/... ./...

      - name: Check coverage >= ${{ env.COVERAGE_THRESHOLD }}%
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | \
            grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: $COVERAGE%"
          awk "BEGIN{               
            if ($COVERAGE+0 < ${{ env.COVERAGE_THRESHOLD }}+0) {
              print \"FAIL: \" $COVERAGE \"% < ${{ env.COVERAGE_THRESHOLD }}%\";
              exit 1
            }
            print \"OK: \" $COVERAGE \"%\"
          }"

      - name: Build binaries
        run: |
          mkdir -p app
          for cmd in server worker scheduler consumer seeder healthcheck; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -ldflags="-s -w" \
              -o app/$cmd ./cmd/$cmd
          done

      - name: Archive binaries
        run: tar -czf "$RUNNER_TEMP/backend-binaries.tar.gz" -C app .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries
          path: ${{ runner.temp }}/backend-binaries.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  container-scan:
    name: Container scan
    runs-on: ubuntu-24.04
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries
          path: ${{ runner.temp }}/backend-binaries

      - name: Restore binaries
        run: |
          mkdir -p app
          tar -xzf "$RUNNER_TEMP/backend-binaries/backend-binaries.tar.gz" -C app

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          chmod +x app/*
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Trivy — SBOM scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: sbom
          scan-ref: sbom.spdx.json
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Export Docker image for downstream jobs
        run: |
          mkdir -p "$RUNNER_TEMP/docker-image"
          docker save "$IMAGE_NAME:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/docker-image/image.tar.gz"

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/docker-image/image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-24.04
    needs: container-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/docker-image

      - name: Load Docker image
        run: docker load --input "$RUNNER_TEMP/docker-image/image.tar.gz"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install cosign
        run: |
          TOOLS_DIR="$RUNNER_TEMP/ci-tools"
          COSIGN_DIR="$TOOLS_DIR/cosign"
          mkdir -p "$COSIGN_DIR"
          if [ ! -x "$COSIGN_DIR/cosign" ]; then
            curl -sSfL \
              https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 \
              -o "$COSIGN_DIR/cosign"
            chmod +x "$COSIGN_DIR/cosign"
          fi
          echo "$COSIGN_DIR" >> "$GITHUB_PATH"

      - name: Sign image (keyless via Sigstore)
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Attach SBOM to image
        run: |
          cosign attach sbom \
            --sbom sbom.spdx.json \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Cleanup temporary files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/docker-image"
          rm -f sbom.spdx.json
